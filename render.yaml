services:
  - type: web
    name: yard-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @yard/api build
    preDeployCommand: pnpm --filter @yard/api db:migrate
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromService:
          type: web
          name: yard-api
          property: port
      - key: DATABASE_RUNTIME_DRIVER
        value: neon
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PRESIGNED_URL_TTL_SECONDS
        value: 300
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
